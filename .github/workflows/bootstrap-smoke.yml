name: Autoconf bootstrap source smoke

on:
  push:
    branches: [master]
    paths:
      - 'bootstrap'
      - 'configure.ac'
      - '.prev-version'
      - 'build-aux/git-version-gen'
      - 'tests/installed-suite-smoke.sh'
      - 'tests/bootstrap-host-paths.sh'
      - 'm4/m4.m4'
      - 'tests/m4-configure-smoke.sh'
      - 'Makefile.am'
      - 'bin/local.mk'
      - 'lib/local.mk'
      - 'lib/freeze.mk'
      - 'man/local.mk'
      - 'tests/local.mk'
      - 'tests/makefile-rules-smoke.py'
      - '.github/workflows/bootstrap-smoke.yml'
  pull_request:
    paths:
      - 'bootstrap'
      - 'configure.ac'
      - '.prev-version'
      - 'build-aux/git-version-gen'
      - 'tests/installed-suite-smoke.sh'
      - 'tests/bootstrap-host-paths.sh'
      - 'm4/m4.m4'
      - 'tests/m4-configure-smoke.sh'
      - 'Makefile.am'
      - 'bin/local.mk'
      - 'lib/local.mk'
      - 'lib/freeze.mk'
      - 'man/local.mk'
      - 'tests/local.mk'
      - 'tests/makefile-rules-smoke.py'
      - '.github/workflows/bootstrap-smoke.yml'

permissions:
  contents: read

jobs:
  bootstrap-paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install standalone-build generators (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y automake m4 texinfo help2man
      - name: Select a capable M4 backend
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install automake m4 texinfo help2man
          echo "$(brew --prefix m4)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
      - name: Verify generated-file rules preserve prior outputs on failure
        shell: bash
        run: python3 tests/makefile-rules-smoke.py

      - name: Verify real Autoconf bootstrap and Automake syntax
        shell: bash
        run: |
          set -euo pipefail
          # A fork without release tags yields UNKNOWN from git-version-gen.
          # Use the tracked last-release version only in this temporary
          # tagless CI checkout. Never commit generated version metadata.
          cp .prev-version .tarball-version
          ./bootstrap

      - name: Verify POSIX shell and bootstrap substitution integrity
        shell: bash
        run: |
          /bin/sh -n bootstrap tests/bootstrap-host-paths.sh tests/m4-configure-smoke.sh
          /bin/sh tests/bootstrap-host-paths.sh
          /bin/sh tests/m4-configure-smoke.sh

      - name: Build and install Autoconf without a parent repository
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/autoconf-standalone-build"
          prefix="$RUNNER_TEMP/autoconf-standalone-prefix"
          mkdir -p "$build_dir"
          (
            cd "$build_dir"
            "$GITHUB_WORKSPACE/configure" --prefix="$prefix"
            make -j2
            make install
          )
          /bin/sh "$GITHUB_WORKSPACE/tests/installed-suite-smoke.sh" "$prefix"
